{% extends "panel/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ title }}</h1>{% if back %}<a class="btn btn-ghost btn-sm" href="{% url back %}">بازگشت</a>{% endif %}</div>
{% if note %}<p class="note">{{ note }}</p>{% endif %}
<form method="post" class="panel-form" {% if multipart %}enctype="multipart/form-data"{% endif %} novalidate>
  {% csrf_token %}
  {% include "includes/form_fields.html" %}
  <div class="form-actions">
    <button class="btn" type="submit">ذخیره</button>
    {% if danger_delete %}<button class="btn btn-danger" type="submit" name="delete" value="1" formnovalidate>حذف اتصال</button>{% endif %}
  </div>
</form>
{% endblock %}
