{% load static %}<script src="{% static 'js/jdate.js' %}" defer></script>
<script>
(() => {
  const sel = document.getElementById("qf-line");
  const box = document.getElementById("qf-extra");
  if (!sel || !box) return;
  const render = () => {
    box.replaceChildren();
    let fields = [];
    try { fields = JSON.parse(sel.selectedOptions[0].dataset.fields || "[]"); } catch (e) {}
    let values = {};
    try { values = JSON.parse(document.getElementById("quote-form").dataset.values || "{}"); } catch (e) {}
    fields.forEach(f => {
      if (!f.name) return;
      const wrap = document.createElement("div");
      wrap.className = "qf-field";
      const label = document.createElement("label");
      label.htmlFor = "qf-f-" + f.name;
      label.textContent = f.label || f.name;
      let input;
      if (f.type === "select") {
        input = document.createElement("select");
        const blank = document.createElement("option");
        blank.value = "";
        blank.textContent = "انتخاب کنید";
        input.append(blank);
        (f.options || []).forEach(value => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          input.append(option);
        });
      } else if (f.type === "textarea") {
        input = document.createElement("textarea");
        input.rows = 2;
      } else {
        input = document.createElement("input");
        input.type = ["text", "number", "email", "tel", "date"].includes(f.type) ? f.type : "text";
      }
      input.id = "qf-f-" + f.name;
      input.name = "f_" + f.name;
      input.required = Boolean(f.required);
      input.maxLength = Number(f.max_length) || 200;
      input.value = values[f.name] || "";
      wrap.append(label, input);
      box.append(wrap);
    });
  };
  const params = new URLSearchParams(location.search);
  if (params.get("line")) sel.value = params.get("line");
  sel.addEventListener("change", render);
  render();
  document.querySelectorAll("[data-line]").forEach(a => a.addEventListener("click", () => { sel.value = a.dataset.line; render(); }));
})();
</script>
