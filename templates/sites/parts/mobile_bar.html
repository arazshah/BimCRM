{% if not is_embed and mbar_items %}
<nav class="s-mbar" aria-label="دسترسی سریع">
  {% for item in mbar_items %}
  {% if item.main %}<a class="s-mbar-main" href="{% if line %}#quote{% else %}{{ item.href }}{% endif %}" data-open-quote><span class="s-mbar-fab"><svg aria-hidden="true"><use href="#i-{{ item.icon }}"/></svg></span><span>{{ item.label }}</span></a>
  {% else %}<a href="{{ item.href }}"{% if item.key == mbar_active %} aria-current="page"{% endif %}{% if item.href|slice:":4" == "http" %} rel="noopener" target="_blank"{% endif %}><svg aria-hidden="true"><use href="#i-{{ item.icon }}"/></svg><span>{{ item.label }}</span></a>{% endif %}
  {% endfor %}
</nav>
{% endif %}
