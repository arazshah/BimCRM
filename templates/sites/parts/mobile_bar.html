{% if not is_embed %}
<nav class="s-mbar" aria-label="دسترسی سریع">
  <a href="/track/"><svg aria-hidden="true"><use href="#i-search"/></svg>پیگیری</a>
  {% if site.phone %}<a href="tel:{{ site.phone }}"><svg aria-hidden="true"><use href="#i-phone"/></svg>تماس</a>{% endif %}
  <a class="s-mbar-main" href="{% if line %}#quote{% else %}/#quote{% endif %}"><svg aria-hidden="true"><use href="#i-doc"/></svg>استعلام</a>
  {% if can_portal %}<a href="/account/"><svg aria-hidden="true"><use href="#i-user"/></svg>پنل</a>{% elif site.whatsapp %}<a href="https://wa.me/98{{ site.whatsapp|slice:'1:' }}" rel="noopener"><svg aria-hidden="true"><use href="#i-chat"/></svg>گفتگو</a>{% endif %}
</nav>
{% endif %}
