# CRM بیمه on Coolify ("Docker Compose" build pack).
# Set the domains of the `web` service in the Coolify UI (see DEPLOY.md), and the
# environment variables marked "set in Coolify" in its Environment Variables tab.

services:
  web:
    build: .
    command: ["web"]
    restart: unless-stopped
    environment: &app-env
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}                         # set in Coolify
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}     # set in Coolify
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-bimcrm.ir}
      PLATFORM_NAMESERVERS: ${PLATFORM_NAMESERVERS:-ns1.bimcrm.ir,ns2.bimcrm.ir}
      # Lets the app create a PowerDNS zone (+ A record to this server) for an agent's own domain
      # once its NS points here. Leave empty to keep agent-domain connecting as "NS only, no site
      # yet" (see DEPLOY.md section 4). PDNS_API_URL is the same PowerDNS used for the wildcard
      # cert, e.g. http://bimcrm-pdns:8081.
      PDNS_API_URL: ${PDNS_API_URL:-}
      PDNS_API_KEY: ${PDNS_API_KEY:-}
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP:-}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-.bimcrm.ir}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://bimcrm.ir,https://*.bimcrm.ir}
      SECURE_SSL: "True"
      # The app connects as a limited role so PostgreSQL row-level security applies;
      # migrations use the owner (MIGRATE_DATABASE_URL). See DEPLOY.md.
      DATABASE_URL: postgres://bimcrm_app:${APP_DB_PASSWORD}@db:5432/bimcrm
      MIGRATE_DATABASE_URL: postgres://bimcrm:${POSTGRES_PASSWORD}@db:5432/bimcrm
      APP_DB_USER: bimcrm_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}               # set in Coolify
      REDIS_URL: redis://redis:6379/0
      SMS_BACKEND: ${SMS_BACKEND:-smsir}
      SMSIR_API_KEY: ${SMSIR_API_KEY}                   # set in Coolify
      SMSIR_OTP_TEMPLATE_ID: ${SMSIR_OTP_TEMPLATE_ID}   # set in Coolify
      SMSIR_LINE_NUMBER: ${SMSIR_LINE_NUMBER}           # set in Coolify
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID}     # set in Coolify
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-False}
      SUPERADMIN_MOBILE: ${SUPERADMIN_MOBILE}           # set in Coolify
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}      # optional first password; change it after login
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    labels:
      # Wildcard router for tenant subdomains (*.bimcrm.ir). It needs the `letsencrypt-dns`
      # resolver in the Coolify proxy config (DEPLOY.md, section 4); without it Traefik just
      # ignores this router. Priority 1 keeps the explicit domains set in the Coolify UI first.
      - traefik.enable=true
      - traefik.http.routers.bimcrm-wild.rule=HostRegexp(`^[a-z0-9-]+[.]bimcrm[.]ir$$`)
      - traefik.http.routers.bimcrm-wild.priority=1
      - traefik.http.routers.bimcrm-wild.entrypoints=https
      - traefik.http.routers.bimcrm-wild.tls=true
      - traefik.http.routers.bimcrm-wild.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.bimcrm-wild.tls.domains[0].main=*.bimcrm.ir
      - traefik.http.routers.bimcrm-wild.service=bimcrm-wild
      - traefik.http.routers.bimcrm-wild-http.rule=HostRegexp(`^[a-z0-9-]+[.]bimcrm[.]ir$$`)
      - traefik.http.routers.bimcrm-wild-http.priority=1
      - traefik.http.routers.bimcrm-wild-http.entrypoints=http
      - traefik.http.routers.bimcrm-wild-http.middlewares=redirect-to-https
      - traefik.http.routers.bimcrm-wild-http.service=bimcrm-wild
      - traefik.http.services.bimcrm-wild.loadbalancer.server.port=8000
      # Catch-all router for agents' own domains (e.g. alborz8351.ir): anything that isn't
      # *.bimcrm.ir. Priority 0 (below the wildcard above) so it only matches when nothing more
      # specific did. Uses Coolify's own default `letsencrypt` resolver — it's already a plain
      # HTTP-01 challenge with no fixed domain list, so Traefik requests a certificate on demand
      # for whatever hostname it sees, the first time someone visits it. Nothing to add in the
      # Coolify proxy config for this. That first visit only succeeds once the domain's own A
      # record points here, which PDNS_API_URL (above) sets up automatically when the agent's NS
      # is confirmed.
      - traefik.http.routers.bimcrm-custom.rule=HostRegexp(`^.+$$`)
      - traefik.http.routers.bimcrm-custom.priority=0
      - traefik.http.routers.bimcrm-custom.entrypoints=https
      - traefik.http.routers.bimcrm-custom.tls=true
      - traefik.http.routers.bimcrm-custom.tls.certresolver=letsencrypt
      - traefik.http.routers.bimcrm-custom.service=bimcrm-wild
      - traefik.http.routers.bimcrm-custom-http.rule=HostRegexp(`^.+$$`)
      - traefik.http.routers.bimcrm-custom-http.priority=0
      - traefik.http.routers.bimcrm-custom-http.entrypoints=http
      - traefik.http.routers.bimcrm-custom-http.middlewares=redirect-to-https
      - traefik.http.routers.bimcrm-custom-http.service=bimcrm-wild
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Also join the shared `coolify` network (same one Traefik and the PowerDNS stack use) so
    # the admin "rebuild zone" action can reach bimcrm-pdns:8081. `default` keeps talking to
    # db/redis as before — Compose drops it once a service lists `networks:` explicitly.
    networks:
      default: {}
      coolify: {}

  worker:
    build: .
    command: ["worker"]
    restart: unless-stopped
    environment: *app-env
    volumes:
      - media:/data/media
    depends_on:
      web:
        condition: service_healthy
    # Runs check_pending_domains, which is what actually calls the PowerDNS API — needs the
    # same network access as `web` above.
    networks:
      default: {}
      coolify: {}

  beat:
    build: .
    command: ["beat"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      web:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bimcrm
      POSTGRES_USER: bimcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}           # set in Coolify
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bimcrm -d bimcrm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  media:

networks:
  default: {}
  coolify:
    external: true
