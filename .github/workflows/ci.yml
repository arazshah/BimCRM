name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bimcrm
          POSTGRES_USER: bimcrm
          POSTGRES_PASSWORD: bimcrm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bimcrm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests connect as a non-superuser: superusers bypass row-level security and would hide RLS bugs.
      DATABASE_URL: postgres://bimcrm_test:bimcrm_test@localhost:5432/bimcrm
    steps:
      - name: Create non-superuser test role
        run: |
          PGPASSWORD=bimcrm psql -h localhost -U bimcrm -d bimcrm -c \
            "CREATE ROLE bimcrm_test LOGIN CREATEDB NOSUPERUSER NOBYPASSRLS PASSWORD 'bimcrm_test';"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - name: Tests (PostgreSQL)
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Docker image builds
        run: docker build -t bimcrm:ci .

  deploy:
    # Only after tests and the image build pass, and only for main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, docker]
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK secret is not set; skipping deploy."
            exit 0
          fi
          curl --fail --show-error --silent --max-time 60 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
